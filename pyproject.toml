# =============================================================================
# pyproject.toml : la "carte d'identité" du projet Python.
# Elle décrit le nom, la version, les dépendances et la config des outils.
# =============================================================================

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentguard"
version = "0.2.1"
description = "Security scanner for AI agent configurations (MCP servers, secrets, supply chain)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "agentguard contributors" }]
keywords = ["security", "mcp", "ai-agents", "llm", "secrets", "sarif", "devsecops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# Sécurité : ZÉRO dépendance à l'exécution.
# Chaque dépendance est une porte d'entrée possible pour une attaque
# "supply chain". Un outil de sécurité doit montrer l'exemple.
dependencies = []

[project.optional-dependencies]
# Outils réservés au développement (jamais installés chez les utilisateurs).
dev = [
    "pytest>=9.0",
    "ruff>=0.16",
    "pre-commit>=4.0",
    "pip-audit>=2.9",
]

[project.scripts]
# Crée la commande `agentguard` dans le terminal.
agentguard = "agentguard.cli:main"

[project.urls]
Homepage = "https://github.com/Matadi-afk/agentguard"
Issues = "https://github.com/Matadi-afk/agentguard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentguard"]

# Sécurité : liste BLANCHE des fichiers de l'archive source (sdist).
# Sans elle, tout fichier local non ignoré par Git (notes, exports, .env mal
# nommé…) pourrait partir dans le paquet publié.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/README.md",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/LICENSE",
  "/pyproject.toml",
]

# -----------------------------------------------------------------------------
# Ruff : vérifie la qualité ET la sécurité du code (règles "S" = Bandit).
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # style de base (PEP 8)
    "F",       # erreurs probables (variables inutilisées…)
    "I",       # tri des imports
    "B",       # bugs courants
    "UP",      # syntaxe Python moderne
    "S",       # SÉCURITÉ (Bandit) : eval, subprocess, secrets en dur…
    "SIM",     # simplifications
]

[tool.ruff.lint.per-file-ignores]
# Dans les tests, `assert` est normal (S101) et les faux secrets sont voulus (S105/S106).
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
