# =============================================================================
# pre-commit : contrôles lancés AUTOMATIQUEMENT avant chaque `git commit`.
# Si un contrôle échoue (ex. un secret détecté), le commit est BLOQUÉ.
# Installation (une seule fois) : pre-commit install
# Lancer à la main sur tout le projet : pre-commit run --all-files
# Versions figées volontairement : on les met à jour avec `pre-commit autoupdate`.
# =============================================================================
repos:
  # 🔐 Détection de secrets (clés API, tokens, mots de passe)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Contrôles de base
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key       # 2e filet anti-clé privée
      - id: check-added-large-files  # évite d'envoyer de gros fichiers par erreur
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Qualité + sécurité du code Python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
